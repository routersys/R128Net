name: リリース

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: バージョン検証とビルド
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: タグからバージョン番号を抽出
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 抽出したバージョン番号を確認
        run: |
          echo "タグ        : ${{ github.ref_name }}"
          echo "バージョン  : ${{ steps.parse.outputs.version }}"
          echo "プレリリース: ${{ steps.parse.outputs.is_prerelease }}"

      - name: バージョン記載の照合
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $version = "${{ steps.parse.outputs.version }}"
          $problems = @()

          $projectPath = "R128Net/R128Net.csproj"
          $text = Get-Content $projectPath -Raw
          if (-not $text.Contains("<Version>$version</Version>")) {
            $current = "記載なし"
            if ($text -match "<Version>([^<]*)</Version>") { $current = $Matches[1] }
            $problems += "$projectPath の <Version> が $current です。$version にしてください。"
          }

          if ($problems.Count -eq 0) {
            Write-Host "バージョン記載は $tag と一致しています"
            exit 0
          }

          foreach ($problem in $problems) {
            Write-Host "::error::$problem"
          }
          Write-Host "::error::リリースの対象は $tag が指すコミットです。タグを付けた後で main へ訂正を積んでも、その訂正はリリースに入りません。タグを削除し、記載を直したコミットを積んでから付け直してください。"
          exit 1

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: 原典 libebur128 をビルドして参照データを生成
        shell: cmd
        run: reference\build.bat

      - name: 依存パッケージを復元
        run: dotnet restore R128Net.slnx

      - name: ソリューションをビルド
        run: |
          dotnet build R128Net.slnx -c Release --no-restore \
            -p:Version=${{ steps.parse.outputs.version }}

      - name: 全テストを実行してリリース品質を確認
        run: |
          dotnet test R128Net.slnx -c Release --no-build \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./test-results

  pack:
    name: NuGet パッケージの作成
    runs-on: windows-latest
    needs: validate
    defaults:
      run:
        shell: bash

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: 依存パッケージを復元
        run: dotnet restore R128Net/R128Net.csproj

      - name: パッケージをビルド
        run: |
          dotnet build R128Net/R128Net.csproj -c Release --no-restore \
            -p:Version=${{ needs.validate.outputs.version }}

      - name: NuGet パッケージを作成
        run: |
          dotnet pack R128Net/R128Net.csproj -c Release --no-build \
            -p:Version=${{ needs.validate.outputs.version }} \
            --output ./artifacts

      - name: 作成されたパッケージ一覧を確認
        run: ls -la ./artifacts/

      - name: パッケージをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/
          retention-days: 90

  publish-nuget:
    name: NuGet.org へ公開
    runs-on: ubuntu-latest
    needs: [validate, pack]
    environment: nuget-release
    permissions:
      id-token: write
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: パッケージをダウンロード
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: ダウンロードしたファイルを確認
        run: ls -la ./artifacts/

      - name: NuGet Trusted Publishing でログイン
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: routersys

      - name: NuGet.org へパッケージを発行
        run: |
          dotnet nuget push ./artifacts/R128Net.*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: シンボルパッケージを発行
        run: |
          dotnet nuget push ./artifacts/R128Net.*.snupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        continue-on-error: true

      - name: GitHub Packages へも発行
        run: |
          dotnet nuget push ./artifacts/R128Net.*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/routersys/index.json \
            --skip-duplicate
        continue-on-error: true

  github-release:
    name: GitHub Release の作成
    runs-on: ubuntu-latest
    needs: [validate, pack, publish-nuget]

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: パッケージをダウンロード
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: 変更履歴の作成
        id: changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PACKAGE: artifacts/R128Net.${{ needs.validate.outputs.version }}.nupkg
        run: |
          $tag        = $env:TAG
          $repository = $env:REPOSITORY
          $server     = $env:SERVER_URL
          $code       = [char]0x60
          $fence      = [string]::new($code, 3)
          $unit       = [char]0x1f
          $record     = [char]0x1e

          $previous = ""
          $candidates = @(git tag --list "v*" --merged $tag --sort=-creatordate | Where-Object { $_ -ne $tag })
          if ($candidates.Count -gt 0) {
            $previous = $candidates[0]
          }
          Write-Host "直前のタグ: $previous"

          $range = if ($previous) { "$previous..$tag" } else { $tag }
          $log = (@(git log "--format=%H%x1f%s%x1f%an%x1f%ad%x1f%b%x1e" --date=short $range) -join "`n") -split $record

          $commits = @()
          foreach ($entry in $log) {
            if (-not $entry.Trim()) { continue }
            $fields = $entry.TrimStart("`n") -split $unit
            if ($fields.Count -lt 5) { continue }
            $commits += [pscustomobject]@{
              Sha     = $fields[0]
              Subject = $fields[1]
              Name    = $fields[2]
              Date    = $fields[3]
              Body    = $fields[4]
              Login   = ""
              Avatar  = ""
            }
          }
          Write-Host "コミット数: $($commits.Count)"

          $categories = [ordered]@{
            A = @{ Title = "追加"; Symbol = "+"; Items = [System.Collections.Generic.List[pscustomobject]]::new() }
            M = @{ Title = "変更"; Symbol = "~"; Items = [System.Collections.Generic.List[pscustomobject]]::new() }
            D = @{ Title = "削除"; Symbol = "-"; Items = [System.Collections.Generic.List[pscustomobject]]::new() }
            F = @{ Title = "修正"; Symbol = "!"; Items = [System.Collections.Generic.List[pscustomobject]]::new() }
          }
          foreach ($commit in $commits) {
            if (-not $commit.Body) { continue }
            foreach ($bodyLine in ($commit.Body -split "`n")) {
              $trimmed = $bodyLine.Trim()
              if ($trimmed -notmatch '^・(.+)-([AMDF])$') { continue }
              $categories[$Matches[2]].Items.Add([pscustomobject]@{ Text = $Matches[1]; Sha = $commit.Sha })
            }
          }

          $pending = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($commit in $commits) {
            [void]$pending.Add($commit.Sha)
          }

          $accounts = @{}
          $page = 1
          while ($pending.Count -gt 0 -and $page -le 20) {
            $rows = @()
            try {
              $rows = @(gh api "repos/$repository/commits?sha=$tag&per_page=100&page=$page" --jq '.[] | [.sha, (.author.login // ""), (.author.avatar_url // "")] | @tsv')
            }
            catch {
              Write-Host "コミットの作者を取得できませんでした: $($_.Exception.Message)"
              break
            }
            if ($LASTEXITCODE -ne 0 -or $rows.Count -eq 0) { break }

            foreach ($row in $rows) {
              $fields = $row -split "`t"
              if ($fields.Count -lt 3) { continue }
              if ($pending.Remove($fields[0])) {
                $accounts[$fields[0]] = @{ Login = $fields[1]; Avatar = $fields[2] }
              }
            }

            if ($rows.Count -lt 100) { break }
            $page++
          }

          foreach ($commit in $commits) {
            if ($accounts.ContainsKey($commit.Sha)) {
              $commit.Login  = $accounts[$commit.Sha].Login
              $commit.Avatar = $accounts[$commit.Sha].Avatar
            }
          }

          $emptyTree = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          $base = if ($previous) { $previous } else { $emptyTree }
          $shortstat = (@(git diff --shortstat $base $tag) -join " ")
          $changedFiles = 0
          $insertions   = 0
          $deletions    = 0
          if ($shortstat -match "(\d+) file")      { $changedFiles = [int]$Matches[1] }
          if ($shortstat -match "(\d+) insertion") { $insertions   = [int]$Matches[1] }
          if ($shortstat -match "(\d+) deletion")  { $deletions    = [int]$Matches[1] }
          $diffStat = @(git diff --stat $base $tag)
          $tagDate = (git log -1 "--format=%ad" --date=short $tag)

          $contributors = @($commits |
            Group-Object -Property { if ($_.Login) { $_.Login } else { $_.Name } } |
            Sort-Object -Property Count -Descending)

          function Get-Icon($avatar, $login, $size) {
            if (-not $avatar) { return "" }
            $sized = if ($avatar.Contains("?")) { "$avatar&s=$($size * 2)" } else { "$avatar" + "?s=$($size * 2)" }
            return "<img src=""$sized"" width=""$size"" height=""$size"" alt=""$login""> "
          }

          $package = Get-Item $env:PACKAGE
          $size = [math]::Round($package.Length / 1MB, 2)

          $body = [System.Collections.Generic.List[string]]::new()
          $body.Add("## 概要")
          $body.Add("")
          $body.Add("| 項目 | 内容 |")
          $body.Add("|---|---|")
          $body.Add("| タグ | [$tag]($server/$repository/tree/$tag) |")
          $body.Add("| 公開日 | $tagDate |")
          if ($previous) {
            $body.Add("| 直前のリリース | [$previous]($server/$repository/releases/tag/$previous) |")
          }
          $body.Add("| コミット数 | $($commits.Count) |")
          $body.Add("| 貢献者 | $($contributors.Count) 名 |")
          $body.Add("| 変更されたファイル | $changedFiles |")
          $body.Add("| 追加された行 | $insertions |")
          $body.Add("| 削除された行 | $deletions |")

          $hasHighlights = ($categories.Values | ForEach-Object { $_.Items.Count } | Measure-Object -Sum).Sum -gt 0
          if ($hasHighlights) {
            $body.Add("")
            $body.Add("## 主な変更")
            foreach ($key in $categories.Keys) {
              $category = $categories[$key]
              if ($category.Items.Count -eq 0) { continue }
              $body.Add("")
              $body.Add("### [$($category.Symbol)] $($category.Title)")
              $body.Add("")
              foreach ($item in $category.Items) {
                $short = $item.Sha.Substring(0, 7)
                $body.Add("- $($item.Text) ([$code$short$code]($server/$repository/commit/$($item.Sha)))")
              }
            }
          }

          $body.Add("")
          $body.Add("## ダウンロード")
          $body.Add("")
          $body.Add("| ファイル | サイズ |")
          $body.Add("|---|---|")
          $body.Add("| $($package.Name) | $size MB |")

          $body.Add("")
          $body.Add("## 貢献者")
          $body.Add("")
          $body.Add("| 貢献者 | コミット数 |")
          $body.Add("|---|---|")
          foreach ($contributor in $contributors) {
            $first = $contributor.Group[0]
            if ($first.Login) {
              $name = (Get-Icon $first.Avatar $first.Login 40) + "[@$($first.Login)]($server/$($first.Login))"
            }
            else {
              $name = $first.Name
            }
            $body.Add("| $name | $($contributor.Count) |")
          }

          $body.Add("")
          $body.Add("## 変更履歴")
          $body.Add("")
          $body.Add("| コミット | 内容 | 貢献者 | 日付 |")
          $body.Add("|---|---|---|---|")
          $maximumCommits = 300
          $listed = 0
          foreach ($commit in $commits) {
            if ($listed -ge $maximumCommits) { break }
            $short = $commit.Sha.Substring(0, 7)
            $subject = $commit.Subject -replace '\|', '\|'
            if ($commit.Login) {
              $author = (Get-Icon $commit.Avatar $commit.Login 20) + "[@$($commit.Login)]($server/$($commit.Login))"
            }
            else {
              $author = $commit.Name
            }
            $body.Add("| [$code$short$code]($server/$repository/commit/$($commit.Sha)) | $subject | $author | $($commit.Date) |")
            $listed++
          }
          if ($commits.Count -gt $maximumCommits) {
            $body.Add("")
            $body.Add("残り $($commits.Count - $maximumCommits) 件のコミットは省略しました。")
          }

          if ($diffStat.Count -gt 0) {
            $body.Add("")
            $body.Add("## 変更されたファイル")
            $body.Add("")
            $body.Add("<details>")
            $body.Add("<summary>差分の統計</summary>")
            $body.Add("")
            $body.Add($fence)
            $maximumStatLines = 200
            $shown = 0
            foreach ($line in $diffStat) {
              if ($shown -ge $maximumStatLines) { break }
              $body.Add($line)
              $shown++
            }
            if ($diffStat.Count -gt $maximumStatLines) {
              $body.Add("... 残り $($diffStat.Count - $maximumStatLines) 行は省略しました。")
            }
            $body.Add($fence)
            $body.Add("")
            $body.Add("</details>")
          }

          if ($previous) {
            $body.Add("")
            $body.Add("## 全ての変更")
            $body.Add("")
            $body.Add("$server/$repository/compare/$previous...$tag")
          }

          $path = "release-body.md"
          Set-Content -Path $path -Value ($body -join "`n") -Encoding utf8NoBOM
          if (-not (Test-Path $path)) {
            throw "変更履歴を作成できませんでした。"
          }
          Write-Host "変更履歴の行数: $($body.Count)"
          $global:LASTEXITCODE = 0


      - name: GitHub Release を作成してパッケージを添付
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          files: |
            artifacts/R128Net.*.nupkg
            artifacts/R128Net.*.snupkg
